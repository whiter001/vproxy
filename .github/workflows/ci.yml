name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install V
        uses: vlang/setup-v@v1.4
        with:
          check-latest: true

      - name: Check formatting
        shell: bash
        run: |
          bash scripts/fmt.sh
          git diff --exit-code

  build:
    strategy:
      fail-fast: false
      matrix:
        proxy: [http, socks5, socks4, mproxy-serve, mproxy-client, mproxy-server]
        target: [linux-x86_64, darwin-x86_64, darwin-arm64, windows-x86_64]
        include:
          - proxy: http
            src: proxy/http/1/proxy.1.v
          - proxy: socks5
            src: proxy/socks5/1/proxy.socks5.v
          - proxy: socks4
            src: proxy/socks4/1/proxy.socks4.v
          - proxy: mproxy-serve
            src: proxy/mproxy/1/mproxy.serve.v
          - proxy: mproxy-client
            src: proxy/mproxy/1/mproxy.client.v
          - proxy: mproxy-server
            src: proxy/mproxy/1/mproxy.server.v
          - target: windows-x86_64
            os: windows-latest
            bin_ext: .exe
          - target: linux-x86_64
            os: ubuntu-latest
          - target: darwin-x86_64
            os: macos-latest
            vflags: -d cross_compile_macos_x86_64
          - target: darwin-arm64
            os: macos-latest
            vflags: -d cross_compile_macos_arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install V
        uses: vlang/setup-v@v1.4
        with:
          check-latest: true

      - name: Build ${{ matrix.proxy }} proxy
        shell: bash
        env:
          VFLAGS: ${{ matrix.vflags }}
        run: |
          mkdir -p ./bin
          v -o ./bin/proxy.${{ matrix.proxy }}.${{ matrix.target }}${{ matrix.bin_ext }} ${{ matrix.src }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.proxy }}-${{ matrix.target }}
          path: bin/*

  test:
    runs-on: ubuntu-latest
    needs: format

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install V
        uses: vlang/setup-v@v1.4
        with:
          check-latest: true

      - name: Run V unit tests
        shell: bash
        run: |
          v test proxy/http/1 proxy/mproxy/xor proxy/mproxy/socks5_dial proxy/lifecycle

      # 真网 E2E（HTTP / SOCKS5 / SOCKS4 → httpbin.org），替换原内联 curl 用例，
      # 覆盖更全（含无鉴权/错误凭据 → 407、SOCKS5 错误凭据拒绝）。
      # REQUIRE_NET=1：httpbin 不可达时硬失败（对齐原内联用例的严格语义）。
      - name: Run real-network tests (httpbin.org)
        shell: bash
        run: |
          REQUIRE_NET=1 bash scripts/test_real.sh

  test-websocket:
    runs-on: ubuntu-latest
    needs: format

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install V
        uses: vlang/setup-v@v1.4
        with:
          check-latest: true

      # WebSocket 协议 + SOCKS4 + lifecycle + CLI 解析 + metrics + mproxy 全套（全部本地，无外网依赖）
      - name: Run integration tests (no network)
        shell: bash
        run: |
          bash proxy/http/1/test_websocket.sh
          bash proxy/http/1/test_metrics.sh
          bash proxy/socks4/1/test_protocol.sh
          bash proxy/lifecycle/test_lifecycle.sh
          bash proxy/vpcli/test_cli.sh
          bash proxy/mproxy/1/test_serve.sh
          bash proxy/mproxy/1/test_tunnel.sh
          bash proxy/mproxy/1/test_socks5_upstream.sh

  release:
    runs-on: ubuntu-latest
    needs: [test, test-websocket, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create release tag
        shell: bash
        run: |
          git tag "v${{ github.run_number }}"
          git push origin "v${{ github.run_number }}"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./bin
          merge-multiple: true

      - name: List artifacts
        shell: bash
        run: ls -laR ./bin/

      - name: Generate checksums
        shell: bash
        run: |
          cd ./bin
          find . -type f -exec sha256sum {} \; > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: |
            bin/**
          generate_release_notes: true
          name: v${{ github.run_number }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
